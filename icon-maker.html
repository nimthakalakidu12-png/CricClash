<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRIC CLASH • 512x512 Icon Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@900&family=Outfit:wght@900&display=swap" rel="stylesheet">
<style>
  body { background:#060812; color:#fff; font-family:'Outfit',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
  canvas { width:260px; height:260px; border-radius:48px; box-shadow:0 20px 50px rgba(0,0,0,0.85), 0 0 30px rgba(245,197,66,0.3); border:2px solid #f5c542; margin:16px 0; }
  button { background:linear-gradient(135deg,#f5c542,#ff9f0a); color:#111; border:none; padding:14px 28px; font-size:15px; font-weight:900; border-radius:14px; cursor:pointer; font-family:'Outfit',sans-serif; }
</style>
</head>
<body>
  <h2 style="margin:0;color:#f5c542">CRIC CLASH • 512×512 ICON MAKER</h2>
  <canvas id="iconCanvas" width="512" height="512"></canvas>
  <button onclick="downloadIcon()">📥 DOWNLOAD icon.png (512×512)</button>

<script>
function drawAppIcon() {
  var c = document.getElementById('iconCanvas');
  var ctx = c.getContext('2d');

  // Deep Stadium Background
  var bg = ctx.createLinearGradient(0, 0, 512, 512);
  bg.addColorStop(0, '#070a16');
  bg.addColorStop(0.5, '#111a36');
  bg.addColorStop(1, '#05070f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 512, 512);

  // Golden Center Glow
  var glow = ctx.createRadialGradient(256, 230, 10, 256, 230, 240);
  glow.addColorStop(0, 'rgba(245, 197, 66, 0.35)');
  glow.addColorStop(1, 'rgba(245, 197, 66, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, 512, 512);

  // Outer Shield Ring
  ctx.strokeStyle = '#f5c542';
  ctx.lineWidth = 14;
  ctx.strokeRect(26, 26, 460, 460);

  ctx.strokeStyle = 'rgba(10, 132, 255, 0.5)';
  ctx.lineWidth = 4;
  ctx.strokeRect(42, 42, 428, 428);

  // Cricket Icon & Typography
  ctx.textAlign = 'center';
  ctx.font = '135px sans-serif';
  ctx.fillText('🏏', 256, 210);

  ctx.fillStyle = '#ffffff';
  ctx.font = '900 78px "Space Grotesk", sans-serif';
  ctx.fillText('CRIC', 256, 330);

  ctx.fillStyle = '#f5c542';
  ctx.font = '900 84px "Space Grotesk", sans-serif';
  ctx.fillText('CLASH', 256, 415);
}

function downloadIcon() {
  drawAppIcon();
  var c = document.getElementById('iconCanvas');
  var a = document.createElement('a');
  a.download = 'icon.png';
  a.href = c.toDataURL('image/png');
  a.click();
}

window.onload = drawAppIcon;
if (document.fonts) { document.fonts.ready.then(drawAppIcon); }
</script>
</body>
</html>
